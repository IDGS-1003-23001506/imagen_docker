name: Kubernetes CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kubernetes:
    name: Crear clúster y desplegar API
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de pruebas
        run: python -m pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m pytest -v

      - name: Crear clúster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: tienda-cluster

      - name: Construir imagen Docker
        run: docker build -t tienda-api:ci .

      - name: Cargar imagen en kind
        run: kind load docker-image tienda-api:ci --name tienda-cluster

      - name: Validar manifiestos
        run: kubectl apply --dry-run=client -f deployment.yaml -f service.yaml

      - name: Aplicar manifiestos
        run: kubectl apply -f deployment.yaml -f service.yaml

      - name: Esperar el rollout
        run: kubectl rollout status deployment/tienda-deployment --timeout=120s

      - name: Revisar recursos
        run: |
          kubectl get nodes
          kubectl get pods -o wide
          kubectl get deployment tienda-deployment
          kubectl get service tienda-service

      - name: Probar la API dentro del clúster
        run: |
          kubectl run api-test --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 -- \
            curl --fail --silent http://tienda-service:8000/version
